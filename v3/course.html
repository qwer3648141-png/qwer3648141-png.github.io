<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09192b"><title>ENJP Ocean 3.0｜正式教材課程</title>
<style>
:root{color-scheme:dark;--bg:#09192b;--panel:#142c45;--edge:#33536b;--text:#f0f7ff;--muted:#acc7da;--accent:#87d6ee;font-family:system-ui,-apple-system,"Noto Sans TC","Noto Sans JP",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}a{color:#9de3f6}header{padding:24px max(16px,calc((100vw - 1380px)/2));background:#0c2135;border-bottom:1px solid var(--edge)}h1{margin:3px 0 8px;font-size:clamp(1.6rem,3vw,2.3rem)}h2{font-size:1.3rem;margin:0 0 12px}h3{margin:0 0 10px;font-size:1.08rem}.sub{color:var(--muted);line-height:1.6}.eyebrow{color:var(--accent);letter-spacing:.13em;font-size:.8rem}.modes,.filters,.actions{display:flex;gap:9px;flex-wrap:wrap}.modes{margin-top:17px}.chip{border:1px solid var(--edge);background:#1a3b54;color:var(--text);border-radius:12px;padding:11px 15px;min-height:45px}.chip[aria-pressed=true]{background:#28627d;border-color:var(--accent);font-weight:700}.shell{display:grid;grid-template-columns:minmax(255px,330px) minmax(0,1fr);gap:20px;max-width:1380px;padding:22px 16px 60px;margin:auto}.panel{border:1px solid var(--edge);background:var(--panel);border-radius:20px;padding:20px;min-width:0}.sidebar{align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}.tabs{display:flex;gap:8px;margin:15px 0}.tabs button{flex:1}.chapter{border:1px solid #34546b;border-radius:13px;margin:9px 0;overflow:hidden}.chapter summary{cursor:pointer;padding:14px;line-height:1.45;font-weight:650}.chapter summary small{display:block;color:var(--muted);font-weight:400;margin-top:5px}.chapter .open{width:calc(100% - 16px);margin:0 8px 9px}.stat{font-size:.88rem;color:var(--muted)}.headrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.search{width:100%;background:#0a2135;color:var(--text);border:1px solid #45667d;border-radius:12px;padding:13px;margin:10px 0 14px;font-size:1rem}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}.item{border:1px solid #35566f;border-radius:16px;background:#10263c;padding:17px;overflow-wrap:anywhere}.item .main{font-size:clamp(1.22rem,2.3vw,1.6rem);line-height:1.95;font-weight:650}.item .translation{color:#d8e8f1;margin:7px 0;font-size:1.04rem}.item .example{margin-top:11px;padding-top:10px;border-top:1px solid #2d4960;line-height:1.9}.item .example ruby{ruby-position:over}.item .example small{display:block;color:#bcd3e1;font-size:.9rem;line-height:1.6}.item .meta{color:#8bd5ed;font-size:.86rem}.item .phrase{font-size:.95rem;margin:8px 0}.item .phrase small{color:#b6cddd;display:block}ruby{ruby-position:over}rt{font-size:.56em;font-weight:400;color:#9bdff0}.item button{margin-top:8px}.item .main ruby{white-space:nowrap}.lesson{margin:14px 0}.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin:20px 0}.pager button{min-width:96px}.notice{background:#173c54;border-left:3px solid var(--accent);padding:13px;border-radius:9px;color:#d8eaf5;line-height:1.7;margin:15px 0}.empty{padding:24px;text-align:center;color:var(--muted)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(max-width:800px){.shell{grid-template-columns:1fr;padding:12px 12px 48px;gap:12px}.sidebar{position:static;max-height:none}.panel{padding:16px}.list{grid-template-columns:1fr}.item{padding:15px}.modes .chip{flex:1 1 130px}header{padding:18px 14px}.sidebar .chapter-list{max-height:290px;overflow:auto}}
</style></head><body>
<header><div class="eyebrow">ENJP OCEAN · 3.0 COURSE LIBRARY</div><h1>🌊 英日學習海域</h1><div class="sub">正式教材版 · 舊版原始資料完整沿用 · 章節自由選擇</div><nav class="modes" aria-label="學習模式"><button class="chip" data-mode="jp" aria-pressed="true">🇯🇵 日本語課程</button><button class="chip" data-mode="en" aria-pressed="false">🇺🇸 English 課程</button><button class="chip" data-mode="dual" aria-pressed="false">🌐 EN × JP 雙語</button></nav></header>
<main class="shell"><aside class="panel sidebar"><h2>🧭 課程導航</h2><div class="sub" id="navDesc"></div><div class="tabs" id="levels" role="group" aria-label="JLPT 等級"><button class="chip" data-level="N5" aria-pressed="true">N5</button><button class="chip" data-level="N4" aria-pressed="false">N4</button><button class="chip" data-level="N3" aria-pressed="false">N3</button></div><div class="chapter-list" id="chapterList"></div><div class="actions" style="margin-top:14px"><button class="chip" data-view="grammar">📘 文法</button><button class="chip" data-view="verbs">🔄 動詞</button><button class="chip" data-view="adjs">🌸 形容詞</button><button class="chip" data-view="vocab">📚 單字</button></div><p class="stat">原始進度及備份由舊版網站管理，本頁不寫入或清除學習紀錄。</p><a href="../index.html">返回舊版完整互動練習與備份工具</a></aside>
<section class="panel" aria-live="polite"><div class="headrow"><div><div class="eyebrow" id="breadcrumb">JAPANESE COURSE</div><h2 id="title">日本語課程</h2></div><span class="stat" id="count"></span></div><div class="notice" id="notice">正在載入原版教材…</div><div class="filters" id="filters"><button class="chip" data-view="vocab" aria-pressed="false">情境單字</button><button class="chip" data-view="grammar" aria-pressed="false">文法</button><button class="chip" data-view="verbs" aria-pressed="false">動詞</button><button class="chip" data-view="adjs" aria-pressed="false">形容詞</button></div><label for="search" class="stat">搜尋日文、英文、中文、假名</label><input id="search" class="search" type="search" placeholder="搜尋目前教材…" autocomplete="off"><div id="items" class="list"></div><div class="pager"><button class="chip" id="prev">上一頁</button><span id="pageLabel" class="stat"></span><button class="chip" id="next">下一頁</button></div></section></main>
<script src="data/catalog.js"></script>
<script src="data/vocab-1-6.js"></script><script src="data/vocab-7-12.js"></script><script src="data/vocab-13-18.js"></script><script src="data/vocab-19-24.js"></script><script src="data/vocab-25-30.js"></script>
<script src="data/grammar.js"></script><script src="data/lexical.js"></script>
<script>
"use strict";
const D=window.ENJP_LEGACY||{},state={mode:"jp",level:"N5",view:"vocab",chapter:1,topic:"all",search:"",page:0},PAGE=24;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safeRuby(s){const t=document.createElement("template");t.innerHTML=String(s||"");const allow=new Set(["RUBY","RT","RP"]);const walk=node=>{for(const ch of [...node.childNodes]){if(ch.nodeType===1){if(!allow.has(ch.tagName)){ch.replaceWith(document.createTextNode(ch.textContent));continue}for(const a of [...ch.attributes])ch.removeAttribute(a.name);walk(ch)}else if(ch.nodeType!==3)ch.remove()}};walk(t.content);return t.innerHTML}
function jpReading(s){const t=document.createElement("div");t.innerHTML=safeRuby(s);t.querySelectorAll("rt").forEach(x=>x.remove());return t.textContent||""}
function speak(text,lang){if(!("speechSynthesis" in window)){alert("此瀏覽器未支援語音播放");return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]*>/g,""));u.lang=lang;u.rate=.88;speechSynthesis.speak(u)}catch(e){alert("語音播放失敗，請檢查裝置語音設定")}}
function list(){let out=[];if(state.view==="vocab"){const all=state.chapter==="all"?Object.values(D.vocab||{}).flat():D.vocab?.[String(state.chapter)]||[];out=all.map(x=>({...x,_kind:"vocab"}))}
if(state.view==="grammar"){out=(D.grammar||[]).filter(x=>x.lv===state.level).map(x=>({...x,_kind:"grammar"}))}
if(state.view==="verbs"||state.view==="adjs"){out=(D.lexical||[]).filter(x=>x.kind===(state.view==="verbs"?"verb":"adj")&&x.level===state.level&&(state.topic==="all"||x.topic===state.topic)).map(x=>({...x,_kind:"lex"}))}
if(state.search){const q=state.search.toLocaleLowerCase();out=out.filter(x=>[x.en,x.jp,x.cn,x.word,x.reading,x.meaning,x.f,x.m,x.p,x.topic,...(x.collocations||[])].filter(Boolean).join(" ").toLocaleLowerCase().includes(q))}
return out}
function wordCard(x){const jp=safeRuby(x.jp_ruby)||esc(x.jp),ex=safeRuby(x.ex_jp_ruby)||esc(x.ex_jp);const phrases=(x.phrase_details||[]).slice(0,3).map(p=>'<div class="phrase">'+esc(p.en)+' — '+(safeRuby(p.jp_ruby)||esc(p.jp))+'<small>'+esc(p.cn)+'</small></div>').join("");return '<article class="item"><div class="meta">'+esc(x.topic)+' · '+esc(x.pos||"")+'</div><div class="main">'+(state.mode==="en"?esc(x.en):jp)+'</div><div class="translation">'+esc(x.cn)+'</div>'+(state.mode!=="jp"?'<div>'+esc(x.en)+' <small>'+esc(x.kk)+'</small></div>':'')+(state.mode==="en"?'<div class="main">'+jp+'</div>':'')+'<div class="example">'+(state.mode==="en"?esc(x.ex_en):ex)+'<small>'+esc(x.ex_cn)+'</small>'+(state.mode==="dual"?'<div>'+esc(x.ex_en)+'</div>':'')+'</div>'+(state.mode==="jp"?"":phrases)+'<div class="actions"><button class="chip" data-say="jp" data-text="'+esc(x.jp)+'">🔊 日本語</button><button class="chip" data-say="en" data-text="'+esc(x.en)+'">🔊 English</button></div></article>'}
function grammarCard(x){return '<article class="item"><div class="meta">'+esc(x.lv)+' · '+esc(x.p)+'</div><div class="main">'+esc(x.f)+'</div><div class="translation">'+esc(x.m)+'</div><div class="example">'+safeRuby(x.j)+'<small>'+esc(x.c)+'</small></div><div class="phrase">'+esc(x.x)+'</div><button class="chip" data-say="jp" data-text="'+esc(jpReading(x.j))+'">🔊 例句</button></article>'}
function lexCard(x){const topic=(D.topics||[]).find(t=>t[0]===x.topic);const coll=(x.collocations||[]).map((s,i)=>'<div class="example">'+esc(s)+'<small>'+esc((x.collocationCn||[])[i])+'</small><button class="chip" data-say="jp" data-text="'+esc(s)+'">🔊 例句</button></div>').join("");return '<article class="item"><div class="meta">'+esc(x.level)+' · '+esc(topic?.[2]||"")+' · '+esc(x.type)+'</div><div class="main">'+esc(x.word)+' <small>（'+esc(x.reading)+'）</small></div><div class="translation">'+esc(x.meaning)+'</div>'+coll+'<button class="chip" data-say="jp" data-text="'+esc(x.word)+'">🔊 單字</button></article>'}
function renderNav(){const jp=state.mode==="jp";$("levels").hidden=!jp;$("navDesc").textContent=jp?"N5–N3 分級教材，文法、動詞、形容詞自由切換":"原版 30 章情境詞彙，點選任何章節開始";document.querySelectorAll("[data-level]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.level===state.level)));const root=$("chapterList");root.replaceChildren();for(let n=1;n<=30;n++){const meta=D.catalog?.[String(n)]||{},det=document.createElement("details");det.className="chapter";det.open=n===state.chapter;const sum=document.createElement("summary");sum.textContent=String(n).padStart(2,"0")+"｜"+(meta.title||"情境單字");const sm=document.createElement("small");sm.textContent=(D.vocab?.[String(n)]||[]).length+" 個單字 · "+(meta.enTitle||"");sum.append(sm);det.append(sum);det.addEventListener("toggle",()=>{if(det.open)root.querySelectorAll("details.chapter").forEach(x=>{if(x!==det)x.open=false})});const b=document.createElement("button");b.className="chip open";b.textContent="開始本章教材";b.addEventListener("click",()=>{state.chapter=n;state.view="vocab";state.page=0;state.search="";$("search").value="";render();$("items").scrollIntoView({block:"nearest"})});det.append(b);root.append(det)}}
function renderContent(){const rows=list(),pages=Math.max(1,Math.ceil(rows.length/PAGE));state.page=Math.min(state.page,pages-1);const selected=rows.slice(state.page*PAGE,(state.page+1)*PAGE);$("items").innerHTML=selected.map(x=>x._kind==="vocab"?wordCard(x):x._kind==="grammar"?grammarCard(x):lexCard(x)).join("")||'<div class="empty">目前沒有符合條件的教材，請更換等級或搜尋字詞。</div>';$("count").textContent=rows.length+" 筆教材";$("pageLabel").textContent=state.page+1+" / "+pages;$("prev").disabled=state.page===0;$("next").disabled=state.page>=pages-1;const labels={vocab:"情境單字",grammar:"日本語文法",verbs:"動詞與活用",adjs:"形容詞"};$("title").textContent=labels[state.view]+(state.view==="vocab"?" · "+(state.chapter==="all"?"全部章節":D.catalog?.[String(state.chapter)]?.title||""):" · "+state.level);$("breadcrumb").textContent=state.mode==="jp"?"JAPANESE COURSE":state.mode==="en"?"ENGLISH COURSE":"BILINGUAL COURSE";$("notice").textContent=state.view==="vocab"?"原版 30 章英日單字，保留例句、中文翻譯、英語音標及片語。":state.view==="grammar"?"原版 N5–N3 文法：形式、接續、中文解釋、日文例句與用法說明。":"原版 N5–N3 "+(state.view==="verbs"?"動詞":"形容詞")+"資料：中文意思與每詞兩組情境用法。";document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.view===state.view)))}
function render(){document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===state.mode)));renderNav();renderContent()}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.view="vocab";state.page=0;render()});document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>{state.level=b.dataset.level;state.page=0;render()});document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.page=0;renderContent()});$("search").addEventListener("input",e=>{state.search=e.target.value.trim();state.page=0;renderContent()});$("prev").onclick=()=>{state.page--;renderContent()};$("next").onclick=()=>{state.page++;renderContent()};$("items").addEventListener("click",e=>{const b=e.target.closest("button[data-say]");if(b)speak(b.dataset.text,b.dataset.say==="en"?"en-US":"ja-JP")});
if(Object.keys(D.vocab||{}).length!==30||D.grammar?.length!==200||D.lexical?.length!==400){$("notice").textContent="教材載入不完整，請重新整理或確認檔案已部署。"}render();
</script></body></html>
