<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENJP Ocean 3.0 · 導覽測試版</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Noto Sans TC","Noto Sans JP",sans-serif;--night:#071827;--panel:#102f47;--edge:#2b536b;--aqua:#86dcf2;--muted:#acc6d7;color:#f3faff;background:var(--night)}

ruby rt{font-size:.58em;color:#b0e7f2;line-height:1.3}

@media(min-width:1000px){#lesson.visible{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}#lesson>h2,#lesson>p,#lesson>.legacy-link{grid-column:1/-1}#lesson .vocab-card{margin:0}}

@media(max-width:740px){main{width:calc(100% - 28px);padding:17px 0 65px}.hero{padding:23px 18px 26px;border-radius:22px}.hero h1{font-size:clamp(1.77rem,7vw,2.25rem);margin:20px 0 11px}.hero p{font-size:.92rem}.hero-badge{font-size:.68rem}.hero-actions{margin-top:19px}.intro-row{gap:7px}.intro-pill{font-size:.73rem;padding:7px 10px}.mode-grid{gap:9px;margin:13px 0 17px}.mode{min-height:105px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;border-radius:17px;padding:12px 6px;gap:7px}.mode-icon{width:38px;height:38px;border-radius:11px;font-size:1.12rem}.mode-copy strong{font-size:.96rem}.mode-copy small{font-size:.72rem;line-height:1.4;margin-top:3px}.panel{padding:17px;border-radius:22px}.course-top{padding-bottom:18px;margin-bottom:19px}.course-head h2{font-size:1.45rem}.course-tag{font-size:.72rem}.levels{gap:7px}.levels button{flex:1;min-width:0;padding:9px 5px;font-size:.92rem;min-height:48px}#chapters{grid-template-columns:1fr;gap:12px}.chapter summary{padding:18px;font-size:1rem}.section{font-size:.96rem}.example{font-size:1.13rem}.vocab-card{padding:16px}.vocab-title strong{font-size:1.4rem}#lesson{padding:16px}}
@media(max-width:365px){.mode-copy strong{font-size:.85rem}.mode-copy small{font-size:.65rem}.hero-top{flex-wrap:wrap}}

</style></head><body><main><header class="hero"><div class="hero-top"><div class="eyebrow">ENJP OCEAN · LANGUAGE JOURNEY</div><span class="hero-badge">3.0 BETA · WIDE 80%</span></div><h1>每一天，都向更遠的海域前進。🌊</h1><p>選擇你的學習路線。從日文 N5～N3、英文基礎到英日雙語練習，依照自己的步調自由探索。</p><div class="hero-actions"><a class="action-link" href="/">📚 原版完整教材</a><a class="action-link secondary" href="#modes">探索學習地圖 ↓</a></div></header><div class="intro-row"><span class="intro-pill">✦ 自由選章</span><span class="intro-pill">✦ 單字與例句</span><span class="intro-pill">✦ 英日分開朗讀</span></div><div class="mode-grid" id="modes"><button class="mode" data-mode="jp" aria-pressed="true"><span class="mode-icon" aria-hidden="true">あ</span><span class="mode-copy"><strong>日本語</strong><small>N5 · N4 · N3 分級學習</small></span><span class="mode-arrow" aria-hidden="true">↗</span></button><button class="mode" data-mode="en" aria-pressed="false"><span class="mode-icon" aria-hidden="true">Aa</span><span class="mode-copy"><strong>English</strong><small>單字 · 文法 · 聽力</small></span><span class="mode-arrow" aria-hidden="true">↗</span></button><button class="mode" data-mode="dual" aria-pressed="false"><span class="mode-icon" aria-hidden="true">⇄</span><span class="mode-copy"><strong>EN × JP</strong><small>雙語配對與情境挑戰</small></span><span class="mode-arrow" aria-hidden="true">↗</span></button></div><section class="panel"><div class="course-top"><div class="course-head"><div class="eyebrow" id="subtitle">JAPANESE COURSE</div><h2 id="course-title">日本語學習地圖</h2><p id="description">點擊章節，即可展開小節。</p></div><span class="course-tag">COURSE MAP · 自由探索</span></div><div class="levels" role="tablist" aria-label="日文程度" id="levels"><button role="tab" aria-selected="true" data-level="N5">N5 基礎</button><button role="tab" aria-selected="false" data-level="N4">N4 初級</button><button role="tab" aria-selected="false" data-level="N3">N3 中級</button></div><div id="chapters"></div><div class="panel" id="lesson" aria-live="polite"></div></section><p class="notice">目前提供部分入門示範教材；其餘章節請先使用舊版完整教材。此頁不修改既有學習進度或備份。</p><p class="footer">ENJP Ocean · 3.0 Beta · 原有教材請使用正式首頁</p></main><script>
"use strict";
const data={N5:[["五十音與發音","平假名、片假名、發音",["平假名","片假名","濁音、拗音與長音"]],["基礎句型","です、ます、助詞",["基本句型","常用助詞","肯定與否定"]],["動詞入門","三類動詞與活用",["三類動詞","ます形","て形"]]],N4:[["動詞活用進階","否定、過去、可能",["ない形","た形","可能形"]],["日常表達","請求、經驗、計畫",["請求與許可","經驗表達","計畫與意圖"]]],N3:[["進階文法","句型比較",["ように／ために","わけ相關句型","ばかり相關句型"]],["閱讀與聽力","短文與對話",["短文閱讀","對話聽力","重點資訊辨識"]]]};
const otherCourses={en:[["日常高頻單字","生活、工作與常用表達",["生活詞彙","工作詞彙","常見片語"]],["英文基礎文法","句型、時態與疑問句",["基本句型","現在與過去","疑問與否定"]],["英文聽力與閱讀","短句與情境理解",["短句聽力","情境對話","短文閱讀"]]],dual:[["英日配對入門","同義詞彙與發音",["日常英日配對","情境片語配對","發音對照"]],["雙語互動挑戰","配對、辨識與回顧",["配對競速","智慧挑戰","錯題回顧"]],["雙語情境應用","工作與生活對話",["購物與餐廳","交通與旅行","職場對話"]]]};

const lessonBank={
"平假名":[["あ","a","日文平假名的「あ」","あさ（早晨）","早晨"],["い","i","日文平假名的「い」","いえ（家）","家"],["う","u","日文平假名的「う」","うみ（海）","海"]],
"片假名":[["ア","a","日文片假名的「ア」","アイス","冰淇淋"],["コ","ko","日文片假名的「コ」","コーヒー","咖啡"],["ネ","ne","日文片假名的「ネ」","ネコ","貓"]],
"基本句型":[["学生","がくせい","學生","私（わたし）は学生（がくせい）です。","我是學生。"],["先生","せんせい","老師","田中（たなか）さんは先生（せんせい）です。","田中先生是老師。"],["日本語","にほんご","日文","日本語（にほんご）を勉強（べんきょう）します。","我學習日文。"]],
"三類動詞":[["食べる","たべる","吃／第二類動詞","朝（あさ）ご飯（はん）を食（た）べます。","我吃早餐。"],["書く","かく","寫／第一類動詞","手紙（てがみ）を書（か）きます。","我寫信。"],["する","する","做／第三類動詞","毎日（まいにち）勉強（べんきょう）します。","我每天學習。"]],
"生活詞彙":[["apple","/ˈæp.əl/","蘋果","I eat an apple.","我吃一顆蘋果。"],["water","/ˈwɔː.tɚ/","水","I drink water every day.","我每天喝水。"],["learn","/lɝːn/","學習","I learn English.","我學英文。"]],
"日常英日配對":[["apple · りんご","apple / りんご","蘋果","I eat an apple. ／ りんごを食（た）べます。","我吃一顆蘋果。"],["water · 水","water / みず","水","I drink water. ／ 水（みず）を飲（の）みます。","我喝水。"],["study · 勉強する","study / べんきょうする","學習","I study every day. ／ 毎日（まいにち）勉強（べんきょう）します。","我每天學習。"]]
};
function jpRuby(text){const box=document.createElement("span");const re=/([一-龯々]+)（([ぁ-ゖー]+)）/g;let pos=0,m;while((m=re.exec(text))){box.append(document.createTextNode(text.slice(pos,m.index)));const ruby=document.createElement("ruby");ruby.append(document.createTextNode(m[1]));const rt=document.createElement("rt");rt.textContent=m[2];ruby.append(rt);box.append(ruby);pos=re.lastIndex}box.append(document.createTextNode(text.slice(pos)));return box}
function speak(text,lang){if(!("speechSynthesis" in window)){alert("此瀏覽器不支援語音播放");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/（[ぁ-ゖー]+）/g,""));u.lang=lang;u.rate=.85;speechSynthesis.speak(u)}
function showLesson(chapter,name){lesson.replaceChildren();const h=document.createElement("h2");h.textContent=chapter+" · "+name;lesson.append(h);const entries=lessonBank[name];if(!entries){const p=document.createElement("p");p.textContent="此小節正在整合既有教材；你可以先使用下方舊版完整課程。";lesson.append(p)}else{const p=document.createElement("p");p.textContent="入門示範教材 · 單字／發音／例句／繁體中文";lesson.append(p);entries.forEach(([word,reading,meaning,sentence,translation])=>{const card=document.createElement("article");card.className="vocab-card";const top=document.createElement("div");top.className="vocab-title";const w=document.createElement("strong");w.textContent=word;const read=document.createElement("small");read.textContent=reading;top.append(w,read);const meaningEl=document.createElement("p");meaningEl.textContent=meaning;const sentenceEl=document.createElement("div");sentenceEl.className="example";sentenceEl.append(jpRuby(sentence));const translationEl=document.createElement("p");translationEl.textContent=translation;const play=document.createElement("button");play.className="play-btn";play.textContent="🔊 播放例句";play.addEventListener("click",()=>speak(sentence,mode==="en"?"en-US":"ja-JP"));card.append(top,meaningEl,sentenceEl,translationEl,play);lesson.append(card)})}const link=document.createElement("a");link.href="/";link.className="legacy-link";link.textContent="開啟原有完整教材與練習 →";lesson.append(link);lesson.classList.add("visible");lesson.scrollIntoView({behavior:"smooth",block:"nearest"})}

let mode="jp",level="N5";
const chapters=document.getElementById("chapters"),lesson=document.getElementById("lesson");
function render(){lesson.classList.remove("visible");document.getElementById("levels").hidden=mode!=="jp";document.getElementById("course-title").textContent=mode==="jp"?"日本語學習地圖":mode==="en"?"English 英文學習": "EN × JP 雙語學習";document.getElementById("subtitle").textContent=mode==="jp"?"JAPANESE COURSE":mode==="en"?"ENGLISH COURSE":"BILINGUAL COURSE";document.getElementById("description").textContent=mode==="jp"?"選擇程度，點擊章節展開小節。":"選擇章節並展開小節；目前僅為導覽原型，不會更動舊資料。";chapters.replaceChildren();const courseChapters=mode==="jp"?data[level]:otherCourses[mode];courseChapters.forEach((chapter,i)=>{const d=document.createElement("details");d.className="chapter";if(i===0)d.open=true;const summary=document.createElement("summary");summary.textContent="第 "+(i+1)+" 章｜"+chapter[0];const small=document.createElement("small");small.textContent=chapter[1];summary.append(small);d.append(summary);const sectionBox=document.createElement("div");sectionBox.className="sections";chapter[2].forEach((name,j)=>{const b=document.createElement("button");b.className="section";b.textContent="第 "+(j+1)+" 節｜"+name;b.addEventListener("click",()=>{showLesson(chapter[0],name)});sectionBox.append(b)});d.append(sectionBox);chapters.append(d)})}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render()}));document.querySelectorAll("[data-level]").forEach(b=>b.addEventListener("click",()=>{level=b.dataset.level;document.querySelectorAll("[data-level]").forEach(x=>x.setAttribute("aria-selected",String(x===b)));render()}));render();
</script></body></html>
