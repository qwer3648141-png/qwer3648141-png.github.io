<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENJP Ocean 3.0 · 導覽測試版</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#09192b;color:#f1f8ff}*{box-sizing:border-box}body{margin:0}main{max-width:700px;margin:auto;padding:24px 16px 72px}.eyebrow{color:#86cbe6;font-size:.78rem;letter-spacing:.13em}h1{font-size:1.9rem;margin:6px 0}h2{font-size:1.25rem;margin:0}p{color:#aac4d5;line-height:1.6;margin:7px 0}.panel{background:#142c45;border:1px solid #2b4c64;border-radius:20px;padding:18px;margin:14px 0}.mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.mode{background:#173650;border:1px solid #36556d;border-radius:16px;padding:16px 8px;min-height:110px;color:#f1f8ff;font-size:1rem;cursor:pointer}.mode[aria-pressed=true]{border-color:#86d6ee;background:#254b65}.mode small{display:block;color:#a9c7d9;margin-top:8px;font-size:.76rem}.levels{display:flex;gap:8px;margin:16px 0}.levels button{flex:1;border:0;border-radius:14px;padding:12px 4px;background:#23445e;color:#d3e6f1;font-size:1rem}.levels button[aria-selected=true]{background:#82d4ec;color:#092034;font-weight:700}.chapter{border:1px solid #36556d;border-radius:17px;margin:12px 0;overflow:hidden}.chapter summary{cursor:pointer;padding:17px;list-style:none;font-weight:650}.chapter summary::-webkit-details-marker{display:none}.chapter summary:after{content:"⌄";float:right;color:#8bd5ed}.chapter[open] summary:after{content:"⌃"}.chapter small{display:block;color:#adc6d8;font-weight:400;margin-top:7px}.sections{padding:0 12px 12px}.section{border:0;border-radius:12px;background:#23445e;color:#f1f8ff;text-align:left;width:100%;padding:14px;margin-top:8px;font-size:.95rem}.section:focus-visible,.mode:focus-visible,button:focus-visible{outline:3px solid #a4e4f4;outline-offset:2px}.footer{color:#89a9be;font-size:.8rem;text-align:center}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tool{border-radius:10px;background:#2a5069;padding:9px 11px;color:#d7effa;font-size:.85rem}#lesson{display:none}#lesson.visible{display:block}.notice{border-left:3px solid #8ad8ed;padding:12px;background:#1b3b53;border-radius:8px}
</style></head><body><main><div class="eyebrow">ENJP OCEAN · 3.0 BETA</div><h1>選擇你的學習海域 🌊</h1><p>日文、英文、英日雙語分開探索；章節自由選擇，不限制進度。</p><div class="mode-grid" id="modes"><button class="mode" data-mode="jp" aria-pressed="true">日本語<small>N5 · N4 · N3</small></button><button class="mode" data-mode="en" aria-pressed="false">English<small>單字 · 文法</small></button><button class="mode" data-mode="dual" aria-pressed="false">EN × JP<small>雙語挑戰</small></button></div><section class="panel"><div class="eyebrow" id="subtitle">JAPANESE COURSE</div><h2 id="course-title">日本語學習地圖</h2><p id="description">點擊章節，即可展開小節。</p><div class="levels" role="tablist" aria-label="日文程度" id="levels"><button role="tab" aria-selected="true" data-level="N5">N5 基礎</button><button role="tab" aria-selected="false" data-level="N4">N4 初級</button><button role="tab" aria-selected="false" data-level="N3">N3 中級</button></div><div id="chapters"></div><div class="panel" id="lesson" aria-live="polite"></div></section><p class="notice">這是獨立導覽原型。沒有連接或修改任何既有學習進度、教材或備份。</p><p class="footer">ENJP Ocean · 3.0 Beta · 原有教材請使用正式首頁</p></main><script>
"use strict";
const data={N5:[["五十音與發音","平假名、片假名、發音",["平假名","片假名","濁音、拗音與長音"]],["基礎句型","です、ます、助詞",["基本句型","常用助詞","肯定與否定"]],["動詞入門","三類動詞與活用",["三類動詞","ます形","て形"]]],N4:[["動詞活用進階","否定、過去、可能",["ない形","た形","可能形"]],["日常表達","請求、經驗、計畫",["請求與許可","經驗表達","計畫與意圖"]]],N3:[["進階文法","句型比較",["ように／ために","わけ相關句型","ばかり相關句型"]],["閱讀與聽力","短文與對話",["短文閱讀","對話聽力","重點資訊辨識"]]]};
const otherCourses={en:[["日常高頻單字","生活、工作與常用表達",["生活詞彙","工作詞彙","常見片語"]],["英文基礎文法","句型、時態與疑問句",["基本句型","現在與過去","疑問與否定"]],["英文聽力與閱讀","短句與情境理解",["短句聽力","情境對話","短文閱讀"]]],dual:[["英日配對入門","同義詞彙與發音",["日常英日配對","情境片語配對","發音對照"]],["雙語互動挑戰","配對、辨識與回顧",["配對競速","智慧挑戰","錯題回顧"]],["雙語情境應用","工作與生活對話",["購物與餐廳","交通與旅行","職場對話"]]]};
let mode="jp",level="N5";
const chapters=document.getElementById("chapters"),lesson=document.getElementById("lesson");
function render(){lesson.classList.remove("visible");document.getElementById("levels").hidden=mode!=="jp";document.getElementById("course-title").textContent=mode==="jp"?"日本語學習地圖":mode==="en"?"English 英文學習": "EN × JP 雙語學習";document.getElementById("subtitle").textContent=mode==="jp"?"JAPANESE COURSE":mode==="en"?"ENGLISH COURSE":"BILINGUAL COURSE";document.getElementById("description").textContent=mode==="jp"?"選擇程度，點擊章節展開小節。":"選擇章節並展開小節；目前僅為導覽原型，不會更動舊資料。";chapters.replaceChildren();const courseChapters=mode==="jp"?data[level]:otherCourses[mode];courseChapters.forEach((chapter,i)=>{const d=document.createElement("details");d.className="chapter";if(i===0)d.open=true;const summary=document.createElement("summary");summary.textContent="第 "+(i+1)+" 章｜"+chapter[0];const small=document.createElement("small");small.textContent=chapter[1];summary.append(small);d.append(summary);const sectionBox=document.createElement("div");sectionBox.className="sections";chapter[2].forEach((name,j)=>{const b=document.createElement("button");b.className="section";b.textContent="第 "+(j+1)+" 節｜"+name;b.addEventListener("click",()=>{lesson.replaceChildren();const h=document.createElement("h2");h.textContent=chapter[0]+" · "+name;const p=document.createElement("p");p.textContent="這是章節導覽示意，尚未接上原有教材與練習。";const t=document.createElement("div");t.className="tools";["📖 學習教材","🔊 語音練習","🎮 互動挑戰","🔁 錯題複習"].forEach(s=>{const x=document.createElement("span");x.className="tool";x.textContent=s;t.append(x)});lesson.append(h,p,t);lesson.classList.add("visible");lesson.scrollIntoView({behavior:"smooth",block:"nearest"})});sectionBox.append(b)});d.append(sectionBox);chapters.append(d)})}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render()}));document.querySelectorAll("[data-level]").forEach(b=>b.addEventListener("click",()=>{level=b.dataset.level;document.querySelectorAll("[data-level]").forEach(x=>x.setAttribute("aria-selected",String(x===b)));render()}));render();
</script></body></html>
