<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENJP Ocean 3.0 · 導覽測試版</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#09192b;color:#f1f8ff}*{box-sizing:border-box}body{margin:0}main{width:80vw;max-width:none;margin:0 auto;padding:42px 0 96px}.eyebrow{color:#86cbe6;font-size:.78rem;letter-spacing:.13em}h1{font-size:1.9rem;margin:6px 0}h2{font-size:1.25rem;margin:0}p{color:#aac4d5;line-height:1.6;margin:7px 0}.panel{background:#142c45;border:1px solid #2b4c64;border-radius:20px;padding:18px;margin:14px 0}.mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.mode{background:#173650;border:1px solid #36556d;border-radius:16px;padding:16px 8px;min-height:110px;color:#f1f8ff;font-size:1rem;cursor:pointer}.mode[aria-pressed=true]{border-color:#86d6ee;background:#254b65}.mode small{display:block;color:#a9c7d9;margin-top:8px;font-size:.76rem}.levels{display:flex;gap:8px;margin:16px 0}.levels button{flex:1;border:0;border-radius:14px;padding:12px 4px;background:#23445e;color:#d3e6f1;font-size:1rem}.levels button[aria-selected=true]{background:#82d4ec;color:#092034;font-weight:700}.chapter{border:1px solid #36556d;border-radius:17px;margin:12px 0;overflow:hidden}.chapter summary{cursor:pointer;padding:17px;list-style:none;font-weight:650}.chapter summary::-webkit-details-marker{display:none}.chapter summary:after{content:"⌄";float:right;color:#8bd5ed}.chapter[open] summary:after{content:"⌃"}.chapter small{display:block;color:#adc6d8;font-weight:400;margin-top:7px}.sections{padding:0 12px 12px}.section{border:0;border-radius:12px;background:#23445e;color:#f1f8ff;text-align:left;width:100%;padding:14px;margin-top:8px;font-size:.95rem}.section:focus-visible,.mode:focus-visible,button:focus-visible{outline:3px solid #a4e4f4;outline-offset:2px}.footer{color:#89a9be;font-size:.8rem;text-align:center}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tool{border-radius:10px;background:#2a5069;padding:9px 11px;color:#d7effa;font-size:.85rem}#lesson{display:none}#lesson.visible{display:block}.notice{border-left:3px solid #8ad8ed;padding:12px;background:#1b3b53;border-radius:8px}
.vocab-card{border:1px solid #355b74;border-radius:15px;padding:15px;margin:12px 0;background:#19374e}.vocab-title{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.vocab-title strong{font-size:1.35rem}.vocab-title small{color:#a9c9dc;font-size:.9rem}.example{font-size:1.13rem;line-height:2.4;overflow-wrap:anywhere}ruby rt{font-size:.58em;color:#a8def0}.play-btn{background:#82d4ec;color:#082235;border:0;border-radius:10px;padding:11px 15px;font-weight:700;font-size:.95rem}.legacy-link{display:inline-block;margin-top:15px;color:#9de4fa;font-weight:700}.levels[hidden]{display:none}
/* ENJP Ocean 3.0 spacious responsive layout */
:root{background:#071625}body{min-height:100vh;background:radial-gradient(ellipse at 86% 3%,rgba(40,117,163,.23),transparent 38%),radial-gradient(ellipse at 4% 72%,rgba(19,85,127,.15),transparent 42%),#071625}

main>.eyebrow{font-size:.85rem;font-weight:700;letter-spacing:.19em}
h1{font-size:clamp(2rem,3.3vw,3.1rem);letter-spacing:.015em;margin:10px 0 12px}
main>p:first-of-type{font-size:1.05rem;margin-bottom:26px}
.panel{padding:clamp(22px,2.5vw,36px);border-radius:26px;background:linear-gradient(145deg,rgba(24,55,80,.96),rgba(15,37,59,.98));box-shadow:0 20px 55px rgba(0,0,0,.16)}
.mode-grid{gap:18px}.mode{min-height:145px;border-radius:22px;padding:23px 18px;font-size:1.3rem;font-weight:700;background:linear-gradient(150deg,#1a3c57,#12314b);transition:transform .18s,border-color .18s,background .18s}.mode:hover{transform:translateY(-3px);border-color:#80d8f0}.mode[aria-pressed=true]{background:linear-gradient(145deg,#285e7d,#1b405c);box-shadow:inset 0 0 0 1px rgba(142,224,247,.28),0 12px 30px rgba(0,0,0,.14)}.mode small{font-size:.9rem;font-weight:400;margin-top:12px}
#course-title{font-size:clamp(1.55rem,2.2vw,2.15rem);margin:5px 0 12px}
#description{font-size:1rem}.levels{max-width:640px;margin:24px 0}.levels button{min-height:52px;font-size:1.03rem}
#chapters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.chapter{margin:0;background:rgba(7,28,46,.4);border-radius:19px}.chapter summary{padding:22px;font-size:1.1rem}.chapter small{font-size:.88rem}.sections{padding:0 16px 16px}.section{font-size:1rem;min-height:54px;padding:15px 17px;cursor:pointer}.section:hover{background:#305a75}
#lesson{margin-top:24px;background:rgba(8,31,51,.72);border:1px solid #3b647c;border-radius:20px;padding:24px}
#lesson h2{font-size:1.45rem;margin-bottom:10px}
.vocab-card{padding:22px;border-radius:18px;margin:16px 0}.vocab-title strong{font-size:1.55rem}.example{font-size:1.22rem;line-height:2.5}.play-btn{cursor:pointer}
@media(min-width:1000px){#lesson.visible{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}#lesson>h2,#lesson>p,#lesson>.legacy-link{grid-column:1/-1}#lesson .vocab-card{margin:0}}
@media(max-width:740px){main{width:calc(100% - 28px);padding:24px 0 72px}.panel{padding:17px;border-radius:20px}.mode-grid{gap:9px}.mode{min-height:108px;padding:15px 7px;border-radius:16px;font-size:1rem}.mode small{font-size:.75rem;margin-top:8px}#chapters{grid-template-columns:1fr;gap:12px}.chapter summary{padding:18px;font-size:1rem}.levels{max-width:none;gap:7px}.levels button{font-size:.95rem}.vocab-card{padding:17px}.example{font-size:1.12rem}#lesson{padding:16px}}
@media(max-width:370px){.mode{font-size:.88rem}.mode small{font-size:.68rem}}
</style></head><body><main><div class="eyebrow">ENJP OCEAN · 3.0 BETA · WIDE 80%</div><h1>選擇你的學習海域 🌊</h1><p>日文、英文、英日雙語分開探索；章節自由選擇，不限制進度。</p><div class="mode-grid" id="modes"><button class="mode" data-mode="jp" aria-pressed="true">日本語<small>N5 · N4 · N3</small></button><button class="mode" data-mode="en" aria-pressed="false">English<small>單字 · 文法</small></button><button class="mode" data-mode="dual" aria-pressed="false">EN × JP<small>雙語挑戰</small></button></div><section class="panel"><div class="eyebrow" id="subtitle">JAPANESE COURSE</div><h2 id="course-title">日本語學習地圖</h2><p id="description">點擊章節，即可展開小節。</p><div class="levels" role="tablist" aria-label="日文程度" id="levels"><button role="tab" aria-selected="true" data-level="N5">N5 基礎</button><button role="tab" aria-selected="false" data-level="N4">N4 初級</button><button role="tab" aria-selected="false" data-level="N3">N3 中級</button></div><div id="chapters"></div><div class="panel" id="lesson" aria-live="polite"></div></section><p class="notice">目前提供部分入門示範教材；其餘章節請先使用舊版完整教材。此頁不修改既有學習進度或備份。</p><p class="footer">ENJP Ocean · 3.0 Beta · 原有教材請使用正式首頁</p></main><script>
"use strict";
const data={N5:[["五十音與發音","平假名、片假名、發音",["平假名","片假名","濁音、拗音與長音"]],["基礎句型","です、ます、助詞",["基本句型","常用助詞","肯定與否定"]],["動詞入門","三類動詞與活用",["三類動詞","ます形","て形"]]],N4:[["動詞活用進階","否定、過去、可能",["ない形","た形","可能形"]],["日常表達","請求、經驗、計畫",["請求與許可","經驗表達","計畫與意圖"]]],N3:[["進階文法","句型比較",["ように／ために","わけ相關句型","ばかり相關句型"]],["閱讀與聽力","短文與對話",["短文閱讀","對話聽力","重點資訊辨識"]]]};
const otherCourses={en:[["日常高頻單字","生活、工作與常用表達",["生活詞彙","工作詞彙","常見片語"]],["英文基礎文法","句型、時態與疑問句",["基本句型","現在與過去","疑問與否定"]],["英文聽力與閱讀","短句與情境理解",["短句聽力","情境對話","短文閱讀"]]],dual:[["英日配對入門","同義詞彙與發音",["日常英日配對","情境片語配對","發音對照"]],["雙語互動挑戰","配對、辨識與回顧",["配對競速","智慧挑戰","錯題回顧"]],["雙語情境應用","工作與生活對話",["購物與餐廳","交通與旅行","職場對話"]]]};

const lessonBank={
"平假名":[["あ","a","日文平假名的「あ」","あさ（早晨）","早晨"],["い","i","日文平假名的「い」","いえ（家）","家"],["う","u","日文平假名的「う」","うみ（海）","海"]],
"片假名":[["ア","a","日文片假名的「ア」","アイス","冰淇淋"],["コ","ko","日文片假名的「コ」","コーヒー","咖啡"],["ネ","ne","日文片假名的「ネ」","ネコ","貓"]],
"基本句型":[["学生","がくせい","學生","私（わたし）は学生（がくせい）です。","我是學生。"],["先生","せんせい","老師","田中（たなか）さんは先生（せんせい）です。","田中先生是老師。"],["日本語","にほんご","日文","日本語（にほんご）を勉強（べんきょう）します。","我學習日文。"]],
"三類動詞":[["食べる","たべる","吃／第二類動詞","朝（あさ）ご飯（はん）を食（た）べます。","我吃早餐。"],["書く","かく","寫／第一類動詞","手紙（てがみ）を書（か）きます。","我寫信。"],["する","する","做／第三類動詞","毎日（まいにち）勉強（べんきょう）します。","我每天學習。"]],
"生活詞彙":[["apple","/ˈæp.əl/","蘋果","I eat an apple.","我吃一顆蘋果。"],["water","/ˈwɔː.tɚ/","水","I drink water every day.","我每天喝水。"],["learn","/lɝːn/","學習","I learn English.","我學英文。"]],
"日常英日配對":[["apple · りんご","apple / りんご","蘋果","I eat an apple. ／ りんごを食（た）べます。","我吃一顆蘋果。"],["water · 水","water / みず","水","I drink water. ／ 水（みず）を飲（の）みます。","我喝水。"],["study · 勉強する","study / べんきょうする","學習","I study every day. ／ 毎日（まいにち）勉強（べんきょう）します。","我每天學習。"]]
};
function jpRuby(text){const box=document.createElement("span");const re=/([一-龯々]+)（([ぁ-ゖー]+)）/g;let pos=0,m;while((m=re.exec(text))){box.append(document.createTextNode(text.slice(pos,m.index)));const ruby=document.createElement("ruby");ruby.append(document.createTextNode(m[1]));const rt=document.createElement("rt");rt.textContent=m[2];ruby.append(rt);box.append(ruby);pos=re.lastIndex}box.append(document.createTextNode(text.slice(pos)));return box}
function speak(text,lang){if(!("speechSynthesis" in window)){alert("此瀏覽器不支援語音播放");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/（[ぁ-ゖー]+）/g,""));u.lang=lang;u.rate=.85;speechSynthesis.speak(u)}
function showLesson(chapter,name){lesson.replaceChildren();const h=document.createElement("h2");h.textContent=chapter+" · "+name;lesson.append(h);const entries=lessonBank[name];if(!entries){const p=document.createElement("p");p.textContent="此小節正在整合既有教材；你可以先使用下方舊版完整課程。";lesson.append(p)}else{const p=document.createElement("p");p.textContent="入門示範教材 · 單字／發音／例句／繁體中文";lesson.append(p);entries.forEach(([word,reading,meaning,sentence,translation])=>{const card=document.createElement("article");card.className="vocab-card";const top=document.createElement("div");top.className="vocab-title";const w=document.createElement("strong");w.textContent=word;const read=document.createElement("small");read.textContent=reading;top.append(w,read);const meaningEl=document.createElement("p");meaningEl.textContent=meaning;const sentenceEl=document.createElement("div");sentenceEl.className="example";sentenceEl.append(jpRuby(sentence));const translationEl=document.createElement("p");translationEl.textContent=translation;const play=document.createElement("button");play.className="play-btn";play.textContent="🔊 播放例句";play.addEventListener("click",()=>speak(sentence,mode==="en"?"en-US":"ja-JP"));card.append(top,meaningEl,sentenceEl,translationEl,play);lesson.append(card)})}const link=document.createElement("a");link.href="/";link.className="legacy-link";link.textContent="開啟原有完整教材與練習 →";lesson.append(link);lesson.classList.add("visible");lesson.scrollIntoView({behavior:"smooth",block:"nearest"})}

let mode="jp",level="N5";
const chapters=document.getElementById("chapters"),lesson=document.getElementById("lesson");
function render(){lesson.classList.remove("visible");document.getElementById("levels").hidden=mode!=="jp";document.getElementById("course-title").textContent=mode==="jp"?"日本語學習地圖":mode==="en"?"English 英文學習": "EN × JP 雙語學習";document.getElementById("subtitle").textContent=mode==="jp"?"JAPANESE COURSE":mode==="en"?"ENGLISH COURSE":"BILINGUAL COURSE";document.getElementById("description").textContent=mode==="jp"?"選擇程度，點擊章節展開小節。":"選擇章節並展開小節；目前僅為導覽原型，不會更動舊資料。";chapters.replaceChildren();const courseChapters=mode==="jp"?data[level]:otherCourses[mode];courseChapters.forEach((chapter,i)=>{const d=document.createElement("details");d.className="chapter";if(i===0)d.open=true;const summary=document.createElement("summary");summary.textContent="第 "+(i+1)+" 章｜"+chapter[0];const small=document.createElement("small");small.textContent=chapter[1];summary.append(small);d.append(summary);const sectionBox=document.createElement("div");sectionBox.className="sections";chapter[2].forEach((name,j)=>{const b=document.createElement("button");b.className="section";b.textContent="第 "+(j+1)+" 節｜"+name;b.addEventListener("click",()=>{showLesson(chapter[0],name)});sectionBox.append(b)});d.append(sectionBox);chapters.append(d)})}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render()}));document.querySelectorAll("[data-level]").forEach(b=>b.addEventListener("click",()=>{level=b.dataset.level;document.querySelectorAll("[data-level]").forEach(x=>x.setAttribute("aria-selected",String(x===b)));render()}));render();
</script></body></html>
