function jpRuby(text){
  const box=document.createElement("span");
  const pattern=/([一-龯々]+)（([ぁ-ゖー]+)）/g;
  let last=0,match;
  while((match=pattern.exec(text))){
    box.append(document.createTextNode(text.slice(last,match.index)));
    const ruby=document.createElement("ruby");
    ruby.append(document.createTextNode(match[1]));
    const rt=document.createElement("rt");rt.textContent=match[2];ruby.append(rt);
    box.append(ruby);last=pattern.lastIndex;
  }
  box.append(document.createTextNode(text.slice(last)));
  return box;
}
function japaneseWord(word,reading){
  if(/^[一-龯々]+$/.test(word)&&/^[ぁ-ゖー]+$/.test(reading)){
    return jpRuby(word+"（"+reading+"）");
  }
  const span=document.createElement("span");span.textContent=word;return span;
}
let activeSpeech=null;
function speak(text,lang,button,status){
  const synth=window.speechSynthesis;
  if(!synth || !("SpeechSynthesisUtterance" in window)){
    status.textContent="目前瀏覽器不支援朗讀。";return;
  }
  if(activeSpeech){
    const previous=activeSpeech;activeSpeech=null;
    previous.button.textContent=previous.original;
    synth.cancel();
    if(previous.button===button){status.textContent="已停止朗讀";return;}
  }
  const clean=(lang==="ja-JP"?text.replace(/（[ぁ-ゖー]+）/g,""):text).trim();
  if(!clean){status.textContent="沒有可播放的文字。";return;}
  const voices=typeof synth.getVoices==="function"?synth.getVoices():[];
  const prefix=lang.slice(0,2).toLowerCase();
  const available=voices.filter(v=>String(v.lang||"").toLowerCase().startsWith(prefix));
  const match=available.find(v=>v.lang.toLowerCase()===lang.toLowerCase()&&v.localService)
    ||available.find(v=>v.lang.toLowerCase()===lang.toLowerCase())
    ||available.find(v=>v.localService)||available[0];
  if(voices.length && !match){
    status.textContent=prefix==="ja"?"找不到日文語音，請先安裝裝置的日文朗讀語音。":"找不到英文語音，請先安裝裝置的英文朗讀語音。";
    return;
  }
  const utterance=new SpeechSynthesisUtterance(clean);
  utterance.lang=lang;utterance.rate=lang==="ja-JP"?.88:.92;utterance.pitch=1;
  if(match)utterance.voice=match;
  const original=button.textContent;
  activeSpeech={utterance,button,original};
  button.textContent="■ 停止朗讀";
  status.textContent=(lang==="ja-JP"?"日本語":"English")+" · "+(match?match.name:"系統預設")+" · 準備播放";
  utterance.onstart=()=>{
    if(activeSpeech?.utterance===utterance)status.textContent=(lang==="ja-JP"?"日文":"英文")+"朗讀中…";
  };
  utterance.onend=()=>{
    if(activeSpeech?.utterance!==utterance)return;
    button.textContent=original;activeSpeech=null;status.textContent="朗讀結束";
  };
  utterance.onerror=e=>{
    if(activeSpeech?.utterance!==utterance)return;
    button.textContent=original;activeSpeech=null;
    status.textContent="播放失敗（"+(e.error||"未知原因")+"），請檢查裝置語音設定。";
  };
  try{synth.speak(utterance)}catch(e){button.textContent=original;activeSpeech=null;status.textContent="語音服務目前無法使用。";}
}

    const card=document.createElement("article");card.className="vocab-card";
    const top=document.createElement("div");top.className="vocab-title";
    const wordEl=document.createElement("strong"),read=document.createElement("small");
    const dual=mode==="dual"&&sentence.includes("／");
    if(dual){
      const [enWord,jpWord]=word.split(" · ");
      const jpReading=(reading.split(" / ")[1]||"").trim();
      wordEl.append(document.createTextNode(enWord+" · "));
      wordEl.append(japaneseWord(jpWord,jpReading));
    }else if(mode==="jp"){wordEl.append(japaneseWord(word,reading))}
    else{wordEl.textContent=word}
    read.textContent=reading;top.append(wordEl,read);
    const meaningEl=document.createElement("p");meaningEl.textContent="中文｜"+meaning;
    const example=document.createElement("div");example.className="example";
    const segments=dual?sentence.split(/\s*／\s*/):[sentence];
    segments.forEach((segment,i)=>{
      const line=document.createElement("div");line.className="example-line";
      if(dual){const label=document.createElement("span");label.className="lang-label";label.textContent=i===0?"EN":"JP";line.append(label)}
      if(mode==="en"||(dual&&i===0)){line.append(document.createTextNode(segment))}
      else{line.append(jpRuby(segment))}
      example.append(line);
    });
    const translationEl=document.createElement("p");translationEl.textContent="翻譯｜"+translation;
    const buttons=document.createElement("div");buttons.className="play-row";
    const status=document.createElement("div");status.className="tts-status";status.setAttribute("role","status");
    if(dual){
      const [enWord,jpWord]=word.split(" · ");
      const jpReading=(reading.split(" / ")[1]||"").trim();
      addSpeechButton(buttons,status,"EN 單字",enWord,"en-US",true);
      addSpeechButton(buttons,status,"JP 單字",jpReading||jpWord,"ja-JP",true);
      addSpeechButton(buttons,status,"EN 例句",segments[0],"en-US",false);
      addSpeechButton(buttons,status,"JP 例句",segments[1],"ja-JP",false);
    }else{
      const lang=mode==="en"?"en-US":"ja-JP";
      addSpeechButton(buttons,status,"播放單字",mode==="en"?word:reading,lang,true);
      addSpeechButton(buttons,status,"播放例句",sentence,lang,false);
    }
    card.append(top,meaningEl,example,translationEl,buttons,status);lesson.append(card);
  });
  const link=document.createElement("a");link.href="/";link.className="legacy-link";
  link.textContent="前往原版完整教材與練習 →";lesson.append(link);
  lesson.classList.add("visible");lesson.scrollIntoView({behavior:"smooth",block:"nearest"});
}

let mode="jp",level="N5";
const chapters=document.getElementById("chapters"),lesson=document.getElementById("lesson");
function render(){lesson.classList.remove("visible");document.getElementById("levels").hidden=mode!=="jp";document.getElementById("course-title").textContent=mode==="jp"?"日本語學習地圖":mode==="en"?"English 英文學習": "EN × JP 雙語學習";document.getElementById("subtitle").textContent=mode==="jp"?"JAPANESE COURSE":mode==="en"?"ENGLISH COURSE":"BILINGUAL COURSE";document.getElementById("description").textContent=mode==="jp"?"選擇程度，點擊章節展開小節。":"選擇章節並展開小節；目前僅為導覽原型，不會更動舊資料。";chapters.replaceChildren();const courseChapters=mode==="jp"?data[level]:otherCourses[mode];courseChapters.forEach((chapter,i)=>{const d=document.createElement("details");d.className="chapter";if(i===0)d.open=true;d.addEventListener("toggle",()=>{if(d.open)chapters.querySelectorAll("details.chapter").forEach(other=>{if(other!==d)other.open=false})});const summary=document.createElement("summary");summary.textContent="第 "+(i+1)+" 章｜"+chapter[0];const small=document.createElement("small");small.textContent=chapter[1];summary.append(small);d.append(summary);const sectionBox=document.createElement("div");sectionBox.className="sections";chapter[2].forEach((name,j)=>{const b=document.createElement("button");b.className="section";b.textContent="第 "+(j+1)+" 節｜"+name;b.addEventListener("click",()=>{showLesson(chapter[0],name)});sectionBox.append(b)});d.append(sectionBox);chapters.append(d)})}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render()}));document.querySelectorAll("[data-level]").forEach(b=>b.addEventListener("click",()=>{level=b.dataset.level;document.querySelectorAll("[data-level]").forEach(x=>x.setAttribute("aria-selected",String(x===b)));render()}));render();
</script></body></html>
