name: ENJP V2 structural checks
on:
  push:
    branches:
      - feature/enjp-ocean-v2
  pull_request:
    paths:
      - index.html
      - v2/**
      - .github/workflows/enjp-v2-check.yml
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node v2/verify-data.js
      - run: node v2/audit-furigana.js
      - run: node v2/verify-ruby-render.js
      - run: node v2/verify-review-core.js
      - run: node v2/verify-navigation.js
      - run: node v2/verify-ruby-dataset.js
      - run: node v2/verify-legacy-scoring.js
      - run: node v2/verify-review-batch.js
      - run: node v2/verify-review-hub.js
      - run: node v3/verify-transfer-lab-integration.js
      - run: node v3/verify-grammar-vocab-separation.js
      - run: node v3/verify-n4n3-completion.js
      - run: node v3/verify-example-expansion.js
      - run: node v3/verify-n5-foundation.js
      - run: node v3/verify-curated-vocab.js
